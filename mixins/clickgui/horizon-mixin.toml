[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "clickgui_ui"
source = "ui.rs"

# The FullBright module's tick.
[[module]]
id = "fullbright"
file = "crates/horizon-client/src/game.rs"
name = "clickgui_fullbright"
source = "fullbright.rs"

