# NoRender's camera overlays, the underwater tint and the fire. `Game::screen_quads`
# publishes the switches and the render crate's `ScreenEffects::build` reads them:
# the two are different crates, and the builder has no access to the mod registry.
# The builder is a `HEAD` because the quad list it returns cannot be post-processed
# (its tail holds a closure, which RETURN refuses), so the water and fire arms are
# skipped by rebuilding the same frame with those two inputs cleared.
[[injection]]
id = "norender_overlay_publish"
kind = "HEAD"
target = "horizon_client::game::render_tick::Game<'_>::screen_quads"
helper = "norender_overlay_publish.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
]

[[injection]]
id = "norender_overlay"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::screen_effects::ScreenEffects::build"
helper = "norender_overlay.rs"
bindings = [
  { name = "effects", ty = "&crate::screen_effects::ScreenEffects", value = "self" },
  { name = "input", ty = "&crate::screen_effects::ScreenInputs<'_>", value = "input" },
]

# NoRender's particles: publish the switch on tick, then skip the particle
# engine's geometry when it is on. It reads a shared atomic because the
# engine lives in the render crate and cannot see the mod registry.
[[injection]]
id = "norender_particles"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "norender_particles.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "norender_particles_render"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::particles::ParticleEngine::render"
helper = "norender_particles_render.rs"
bindings = []

[[injection]]
id = "norender_particles_culled"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::particles::ParticleEngine::render_culled"
helper = "norender_particles_culled.rs"
bindings = []

# NoRender's glowing outlines, first-person hand and item-frame items. Its
# name tags cancel `name_tag_geometry` in `nametags_hide`: the per-tag hook
# is skipped when only a mixin mod is loaded, because it counts runtime mods.
[[injection]]
id = "norender_outline"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_entity_outline"
