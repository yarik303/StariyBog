# Input: toggle the GUI and consume input while it is open. The app's
# dispatcher, not the game's own handler: its body has no macros, so this
# bundle also applies with older horizon-mixins versions.
[[injection]]
id = "window"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::<App as ApplicationHandler>::window_event"
helper = "window.rs"
bindings = [
  { name = "app", ty = "&mut crate::game::App", value = "&mut *self" },
  { name = "event", ty = "&winit::event::WindowEvent", value = "&event" },
]

# The timer scales `DeltaTracker.Timer`'s per-frame delta ticks. The clock
# itself, its virtual time and the UI/render frame times keep their real
# length; only how many ticks a frame yields changes.
[[injection]]
id = "timer_delta"
kind = "MODIFY_EXPRESSION_VALUE"
target = "horizon_client_lib::clock::Timer::advance_game_time"
selector = "(current_ms - self.last_ms) as f32"
ordinal = 0
require = 1
helper = "timer_delta.rs"
bindings = [
  { name = "delta", ty = "f32", value = "$value" },
]

# The terrain mode scales the travel input the movement tick is about to use,
# where Alan's StrafeEvent scales the friction speed instead.
[[injection]]
id = "terrain_input"
kind = "MODIFY_ARG"
target = "horizon_client_lib::motion::MotionWorld<'_,'_,'_>::travel_in_air"
selector = "living_air::travel_in_air"
require = 1
ordinal = 0
argument = 1
helper = "terrain_input.rs"
bindings = [
  { name = "input", ty = "horizon_core::geometry::Vec3", value = "$value" },
]

# Module ticks (FullBright's ramp and effect).
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Scaffold's Eagle mode: the movement input is read and not yet applied, which
# is where the reference's MoveInputEvent sets its sneak. Setting it here counts
# for this tick; the key set is consumed by the next tick's physics.
[[injection]]
id = "scaffold_eagle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_movement_input"
helper = "scaffold_eagle.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "sneak", ty = "&mut bool", value = "&mut *sneak" },
]

# The attack click, for AutoWeapon's OnAttack. It has to see the click before
# the game does, since a server world consumes it before `native_tick`.
[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# Zoom's held factor, through the same native zoom hook Horizon's own Zoom
# mod uses. The window hook above turns the bind key into the held state; this
# hands it to the camera.
[[injection]]
id = "zoom_view"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_zoom"
helper = "zoom_view.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "zoom", ty = "&mut Option<crate::game::native_hooks::NativeZoom>", value = "&mut *zoom" },
]

# While Zoom's key is held, the wheel zooms instead of scrolling the hotbar.
[[injection]]
id = "zoom_wheel"
