[mod]
id = "clickgui"
version = "0.1.0"
priority = 100

# The commit the mod was tested on. It has to hook one game function
# (`window_event`, to take input while the GUI is open), so it is pinned.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The registry, settings model and GUI state.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "clickgui"
source = "runtime.rs"

# NoRender's particle switch: the game sets it, the render crate's particle
# engine reads it, and the two are different crates.
[[module]]
id = "norender_state"
file = "crates/horizon-client-render/src/lib.rs"
name = "clickgui_norender"
visibility = "pub"
source = "norender_state.rs"

# Google Sans rendering: the masks, the uploader and the entry point.
[[module]]
id = "font"
file = "crates/horizon-client/src/game.rs"
name = "clickgui_font"
source = "font.rs"

[[module]]
id = "font_data"
file = "crates/horizon-client/src/game.rs"
name = "clickgui_font_data"
source = "font_data.rs"

[[module]]
id = "font_atlas"
file = "crates/horizon-client/src/game.rs"
name = "clickgui_font_atlas"
source = "font_atlas.rs"

